name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - /data/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Oslo
      DB_PASSWORD: AHQ-BQeDxaHdJ4ihcNa0HGUe
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - model-cache:/cache
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: AHQ-BQeDxaHdJ4ihcNa0HGUe
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      - /data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  immich-proxy:
    container_name: immich_proxy
    image: nginx:latest
    depends_on:
      - immich-server
    restart: always
    volumes:
      - ./certs/:/etc/nginx/ssl/:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      my-macvlan-network:
        ipv4_address: 192.168.1.139
    mac_address: 02:42:C0:A8:01:8B

networks:
  my-macvlan-network:
    external: true

volumes:
  model-cache:
