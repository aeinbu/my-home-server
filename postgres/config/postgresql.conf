# PostgreSQL configuration
# https://www.postgresql.org/docs/current/runtime-config.html

# -------------------------------------------------------
# Connections
# -------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# -------------------------------------------------------
# TLS
# -------------------------------------------------------
ssl = on
ssl_cert_file = '/etc/certs/postgres.lab.crt'
# Key is copied to /tmp/server.key at startup with correct permissions (see entrypoint in docker-compose.yaml)
ssl_key_file = '/tmp/server.key'
ssl_ca_file = '/etc/ssl/rootCA.pem'

# -------------------------------------------------------
# Memory
# -------------------------------------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB

# -------------------------------------------------------
# WAL / Checkpointing
# -------------------------------------------------------
wal_buffers = 8MB
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 1GB

# -------------------------------------------------------
# Planner
# -------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
log_timezone = 'Europe/Oslo'
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # log queries taking more than 1 second
log_line_prefix = '%t [%p] %u@%d '
log_connections = on
log_disconnections = on
log_lock_waits = on

# -------------------------------------------------------
# Locale
# -------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'Europe/Oslo'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
