## RabbitMQ 4+ configuration
## https://www.rabbitmq.com/configure.html

# -------------------------------------------------------
# Networking
# -------------------------------------------------------
listeners.tcp.default = 5672
# listeners.ssl.default = 5671

# Management UI
management.tcp.port = 15672

# -------------------------------------------------------
# Default user (change before going to production!)
# Alternatively, use a definitions file or set via
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS env vars.
# -------------------------------------------------------
default_user = admin
default_pass = changeme
default_vhost = /

default_user_tags.administrator = true

# -------------------------------------------------------
# Resource limits
# -------------------------------------------------------
# Pause publishing when RAM usage exceeds 40% of available
vm_memory_high_watermark.relative = 0.4

# Pause publishing when free disk space drops below 1 GB
disk_free_limit.absolute = 1GB

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
log.console = true
log.console.level = info
log.file = false

# -------------------------------------------------------
# TLS
# -------------------------------------------------------
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/ssl/rootCA.pem
ssl_options.certfile   = /etc/certs/rabbitmq.lab.pem
ssl_options.keyfile    = /etc/certs/rabbitmq.lab.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = false

management.ssl.port       = 15671
management.ssl.cacertfile = /etc/ssl/rootCA.pem
management.ssl.certfile   = /etc/certs/rabbitmq.lab.pem
management.ssl.keyfile    = /etc/certs/rabbitmq.lab.key
